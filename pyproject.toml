[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "threatlensai"
version = "1.0.0"
description = "AI-powered log investigation assistant for auth, nginx, Docker logs, and incident reports"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"

[project.scripts]
threat-lens = "apps.api.app.cli:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["apps*"]
exclude = ["apps.web*"]
